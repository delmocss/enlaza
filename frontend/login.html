<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Iniciar sesion</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-stone-100 to-canela-50 px-4 dark:from-stone-900 dark:to-stone-800">
    <button id="theme-toggle" type="button" title="Cambiar tema"
            class="fixed right-4 top-4 rounded-md p-2 text-stone-500 transition hover:bg-stone-200/60 dark:text-stone-400 dark:hover:bg-stone-700">
        <span id="theme-toggle-icon"></span>
    </button>

    <div class="w-full max-w-sm">
        <a href="/" class="mb-6 flex flex-col items-center gap-2 text-center">
            <span id="brand-icon" class="flex h-11 w-11 items-center justify-center rounded-xl bg-canela-600 text-white shadow-sm dark:bg-canela-500"></span>
            <h1 class="text-xl font-semibold text-stone-900 dark:text-stone-100">Enlaza</h1>
            <p class="text-sm text-stone-500 dark:text-stone-400">Facturacion con cadena de integridad verificable</p>
        </a>

        <div class="card p-8 shadow-sm">
            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="email" class="field-label">Email</label>
                    <input id="email" name="email" type="email" required autocomplete="username" class="field-input" />
                </div>
                <div>
                    <label for="password" class="field-label">Contrasena</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password" class="field-input" />
                </div>
                <p id="error-banner" class="hidden banner-error"></p>
                <p id="wake-notice" role="status" class="hidden rounded-md border border-canela-300 bg-canela-50 px-3 py-2 text-sm text-canela-800 dark:border-canela-700 dark:bg-canela-900/30 dark:text-canela-200">
                    El servidor gratuito se esta despertando. Puede tardar hasta un minuto; no cierres la pagina.
                </p>
                <button type="submit" class="btn-primary w-full">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { login, apiFetch, ApiError, warmUpApi } from '/common/js/apiClient.js';
        import { homeFor } from '/common/js/session.js';
        import { showError } from '/common/js/ui.js';
        import { mountThemeToggle } from '/common/js/theme.js';
        import { iconLogo } from '/common/js/icons.js';

        document.getElementById('brand-icon').innerHTML = iconLogo('h-6 w-6');
        mountThemeToggle();
        warmUpApi();

        const form = document.getElementById('login-form');
        const errorBanner = document.getElementById('error-banner');
        const submitButton = form.querySelector('button[type="submit"]');
        const wakeNotice = document.getElementById('wake-notice');
        const submitLabel = submitButton.textContent.trim();

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            showError(errorBanner, null);
            submitButton.disabled = true;
            submitButton.textContent = 'Entrando...';

            try {
                await login(form.email.value.trim(), form.password.value, {
                    onWaiting: () => wakeNotice.classList.remove('hidden'),
                });
                const me = await apiFetch('/auth/me');
                window.location.href = homeFor(me.role);
            } catch (error) {
                let message = 'No se pudo iniciar sesion. Intenta de nuevo.';
                if (error instanceof ApiError && error.status === 401) {
                    message = 'Email o contrasena incorrectos';
                } else if (error instanceof ApiError && (error.status === 0 || error.status >= 502)) {
                    message = 'No se pudo conectar con el servidor. Puede que aun se este despertando: espera unos segundos e intentalo de nuevo.';
                }
                showError(errorBanner, message);
                wakeNotice.classList.add('hidden');
                submitButton.textContent = submitLabel;
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
