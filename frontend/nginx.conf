server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos HTML nunca se cachean -- ni en el navegador ni en el
    # bfcache de atras/adelante, que Cache-Control: no-store desactiva por
    # especificacion. Sin esto, el navegador puede restaurar una pagina
    # protegida ya renderizada (nav pintado, datos cargados) al navegar
    # adelante/atras SIN pasar de nuevo por el <script> que llama a
    # bootstrapPage()/requireRole(), asi que una sesion cerrada en el
    # medio no se detectaria. El listener de "pageshow" en nav.js fuerza
    # una recarga cuando el bfcache SI se usa, pero esta cabecera es la
    # que garantiza que el navegador ni siquiera lo intente.
    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
    }

    # JS/CSS: revalidar siempre con una peticion condicional (barata, no
    # vuelve a descargar si no ha cambiado) para no servir una version
    # vieja tras un despliegue nuevo sin que el usuario tenga que forzar
    # una recarga dura.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
