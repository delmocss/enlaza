<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza</title>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50">
    <p class="text-sm text-slate-500">Cargando...</p>
    <script type="module">
        import { ensureAccessToken, apiFetch } from '/common/js/apiClient.js';
        import { homeFor } from '/common/js/session.js';

        const refreshed = await ensureAccessToken();
        if (!refreshed) {
            window.location.href = '/login.html';
        } else {
            try {
                const me = await apiFetch('/auth/me');
                window.location.href = homeFor(me.role);
            } catch {
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
