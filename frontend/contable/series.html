<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Series de facturacion</title>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50">
    <header id="app-nav" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <a href="/contable/dashboard.html" class="text-sm text-indigo-600 hover:underline">&larr; Mis empresas</a>
        <h1 class="mb-6 mt-2 text-xl font-semibold text-slate-900">Series de facturacion</h1>

        <section class="mb-8 rounded-lg border border-slate-200 bg-white p-6">
            <h2 class="mb-4 text-sm font-semibold text-slate-700">Nueva serie</h2>
            <form id="serie-form" class="flex flex-wrap items-end gap-4" novalidate>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Codigo</label>
                    <input name="codigo" required placeholder="p. ej. FAC-2026"
                           class="mt-1 w-56 rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <button type="submit" id="submit-button"
                        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">
                    Crear serie
                </button>
            </form>
            <p id="form-error" class="mt-3 hidden rounded-md bg-red-50 px-3 py-2 text-sm text-red-700"></p>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-slate-200 text-slate-500">
                    <tr>
                        <th class="px-4 py-3 font-medium">Codigo</th>
                        <th class="px-4 py-3 font-medium">Ultimo numero</th>
                        <th class="px-4 py-3 font-medium">Estado</th>
                        <th class="px-4 py-3 font-medium">Acciones</th>
                    </tr>
                </thead>
                <tbody id="series-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireRole } from '/common/js/session.js';
        import { renderNav } from '/common/js/nav.js';
        import { escapeHtml, showError } from '/common/js/ui.js';

        const me = await requireRole('CONTABLE');
        if (me) {
            renderNav(me);
            init();
        }

        function init() {
            const empresaId = new URLSearchParams(window.location.search).get('empresaId');
            if (!empresaId) {
                window.location.href = '/contable/dashboard.html';
                return;
            }

            const form = document.getElementById('serie-form');
            const formError = document.getElementById('form-error');
            const submitButton = document.getElementById('submit-button');
            const tbody = document.getElementById('series-body');

            async function loadSeries() {
                const series = await apiFetch(`/empresas/${empresaId}/series`);
                tbody.innerHTML = series.map(serie => {
                    const estadoBadge = serie.activa
                        ? '<span class="rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">Activa</span>'
                        : '<span class="rounded-full bg-slate-200 px-2 py-0.5 text-xs font-medium text-slate-600">Inactiva</span>';

                    return `
                        <tr class="border-b border-slate-100 last:border-0" data-id="${serie.id}">
                            <td class="px-4 py-3">${escapeHtml(serie.codigo)}</td>
                            <td class="px-4 py-3">${serie.ultimoNumero}</td>
                            <td class="px-4 py-3">${estadoBadge}</td>
                            <td class="px-4 py-3">
                                <div class="flex flex-wrap gap-3">
                                    <a href="/contable/facturas.html?empresaId=${empresaId}&serieId=${serie.id}"
                                       class="text-indigo-600 hover:underline">Facturas</a>
                                    <a href="/contable/verificacion.html?empresaId=${empresaId}&serieId=${serie.id}"
                                       class="text-indigo-600 hover:underline">Verificar integridad</a>
                                    <button type="button" data-action="toggle" class="text-slate-600 hover:underline">
                                        ${serie.activa ? 'Desactivar' : 'Activar'}
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('') || '<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">Sin series todavia</td></tr>';

                tbody.querySelectorAll('button[data-action="toggle"]').forEach(button => {
                    button.addEventListener('click', async () => {
                        const id = button.closest('tr').dataset.id;
                        const serie = series.find(s => s.id === id);
                        const accion = serie.activa ? 'desactivar' : 'activar';
                        button.disabled = true;
                        try {
                            await apiFetch(`/empresas/${empresaId}/series/${id}/${accion}`, { method: 'PATCH' });
                            await loadSeries();
                        } catch (error) {
                            alert(error instanceof ApiError ? error.message : 'No se pudo actualizar la serie');
                            button.disabled = false;
                        }
                    });
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                showError(formError, null);
                submitButton.disabled = true;

                try {
                    await apiFetch(`/empresas/${empresaId}/series`, {
                        method: 'POST',
                        body: JSON.stringify({ codigo: form.codigo.value.trim() }),
                    });
                    form.reset();
                    await loadSeries();
                } catch (error) {
                    showError(formError, error instanceof ApiError ? error.message : 'No se pudo crear la serie');
                } finally {
                    submitButton.disabled = false;
                }
            });

            loadSeries();
        }
    </script>
</body>
</html>
