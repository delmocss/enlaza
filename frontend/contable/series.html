<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Series de facturacion</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-stone-900">
    <header id="app-nav" class="bg-white dark:bg-stone-800"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <nav id="breadcrumbs" class="mb-4 flex items-center gap-1.5 text-sm" aria-label="Breadcrumb"></nav>
        <h1 class="page-title mb-6">Series de facturacion</h1>

        <div id="stats-row" class="mb-6 grid grid-cols-3 gap-4 sm:w-[28rem]"></div>

        <section class="card mb-8 p-6">
            <h2 class="mb-4 text-sm font-semibold text-stone-700 dark:text-stone-300">Nueva serie</h2>
            <form id="serie-form" class="flex flex-wrap items-end gap-4" novalidate>
                <div>
                    <label class="field-label">Codigo</label>
                    <input name="codigo" required placeholder="p. ej. FAC-2026" class="field-input w-56" />
                </div>
                <button type="submit" id="submit-button" class="btn-primary">
                    Crear serie
                </button>
            </form>
            <p id="form-error" class="mt-3 hidden banner-error"></p>
        </section>

        <section class="card">
            <table class="table-shell">
                <thead class="table-head-row">
                    <tr>
                        <th class="table-head-cell">Codigo</th>
                        <th class="table-head-cell">Ultimo numero</th>
                        <th class="table-head-cell">Estado</th>
                        <th class="table-head-cell">Acciones</th>
                    </tr>
                </thead>
                <tbody id="series-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireQueryParams } from '/common/js/session.js';
        import { bootstrapPage, renderBreadcrumbs } from '/common/js/nav.js';
        import { escapeHtml, showError, renderBadge, confirmAndRun, renderEmptyRow, renderSkeletonRows } from '/common/js/ui.js';
        import { iconDownload, iconPower, iconCheckCircle } from '/common/js/icons.js';

        bootstrapPage('CONTABLE', init);

        async function init() {
            const query = requireQueryParams(['empresaId'], '/contable/dashboard.html');
            if (!query) {
                return;
            }
            const { empresaId } = query;

            const form = document.getElementById('serie-form');
            const formError = document.getElementById('form-error');
            const submitButton = document.getElementById('submit-button');
            const tbody = document.getElementById('series-body');

            async function loadBreadcrumbs() {
                const empresas = await apiFetch('/mis-empresas').catch(() => []);
                const empresa = empresas.find(e => e.id === empresaId);
                renderBreadcrumbs([
                    { label: 'Mis empresas', href: '/contable/dashboard.html' },
                    { label: empresa ? empresa.razonSocial : 'Empresa' },
                    { label: 'Series' },
                ]);
            }

            function renderStats(series) {
                const activas = series.filter(s => s.activa).length;
                const totalFacturas = series.reduce((sum, s) => sum + s.ultimoNumero, 0);
                document.getElementById('stats-row').innerHTML = `
                    <div class="stat-tile">
                        <p class="stat-tile-label">Series</p>
                        <p class="stat-tile-value">${series.length}</p>
                    </div>
                    <div class="stat-tile">
                        <p class="stat-tile-label">Activas</p>
                        <p class="stat-tile-value">${activas}</p>
                    </div>
                    <div class="stat-tile">
                        <p class="stat-tile-label">Facturas</p>
                        <p class="stat-tile-value">${totalFacturas}</p>
                    </div>
                `;
            }

            async function loadSeries() {
                tbody.innerHTML = renderSkeletonRows(3, 4);
                const series = await apiFetch(`/empresas/${empresaId}/series`);
                renderStats(series);
                tbody.innerHTML = series.map(serie => {
                    return `
                        <tr class="table-row" data-id="${serie.id}">
                            <td class="table-cell">${escapeHtml(serie.codigo)}</td>
                            <td class="table-cell">${serie.ultimoNumero}</td>
                            <td class="table-cell">${renderBadge(serie.activa, 'Activa', 'Inactiva')}</td>
                            <td class="table-cell">
                                <div class="flex flex-wrap gap-2">
                                    <a href="/contable/facturas.html?empresaId=${empresaId}&serieId=${serie.id}" class="btn-icon">
                                        ${iconDownload()} Facturas
                                    </a>
                                    <a href="/contable/verificacion.html?empresaId=${empresaId}&serieId=${serie.id}" class="btn-icon">
                                        ${iconCheckCircle('h-4 w-4')} Verificar
                                    </a>
                                    <button type="button" data-action="toggle" class="btn-icon">
                                        ${iconPower()} ${serie.activa ? 'Desactivar' : 'Activar'}
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('') || renderEmptyRow(4, 'Sin series todavia');

                tbody.querySelectorAll('button[data-action="toggle"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        const serie = series.find(s => s.id === id);
                        const accion = serie.activa ? 'desactivar' : 'activar';
                        confirmAndRun({
                            button,
                            action: () => apiFetch(`/empresas/${empresaId}/series/${id}/${accion}`, { method: 'PATCH' }),
                            onSuccess: loadSeries,
                            successMessage: serie.activa ? 'Serie desactivada' : 'Serie activada',
                            errorFallback: 'No se pudo actualizar la serie',
                        });
                    });
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                showError(formError, null);
                submitButton.disabled = true;

                try {
                    await apiFetch(`/empresas/${empresaId}/series`, {
                        method: 'POST',
                        body: JSON.stringify({ codigo: form.codigo.value.trim() }),
                    });
                    form.reset();
                    await loadSeries();
                } catch (error) {
                    showError(formError, error instanceof ApiError ? error.message : 'No se pudo crear la serie');
                } finally {
                    submitButton.disabled = false;
                }
            });

            loadBreadcrumbs();
            loadSeries();
        }
    </script>
</body>
</html>
