<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Clientes</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950">
    <header id="app-nav" class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <nav id="breadcrumbs" class="mb-4 flex items-center gap-1.5 text-sm" aria-label="Breadcrumb"></nav>
        <h1 class="mb-6 text-xl font-semibold text-slate-900 dark:text-slate-100">Clientes</h1>

        <section class="card mb-8 p-6">
            <h2 id="form-title" class="mb-4 text-sm font-semibold text-slate-700 dark:text-slate-300">Nuevo cliente</h2>
            <form id="cliente-form" class="grid grid-cols-1 gap-4 sm:grid-cols-2" novalidate>
                <div>
                    <label class="field-label">Nombre</label>
                    <input name="nombre" required class="field-input" />
                </div>
                <div>
                    <label class="field-label">NIF</label>
                    <input name="nif" required class="field-input" />
                </div>
                <div>
                    <label class="field-label">Direccion</label>
                    <input name="direccion" class="field-input" />
                </div>
                <div>
                    <label class="field-label">Email</label>
                    <input name="email" type="email" class="field-input" />
                </div>
                <p id="form-error" class="hidden banner-error sm:col-span-2"></p>
                <div class="flex gap-3 sm:col-span-2">
                    <button type="submit" id="submit-button" class="btn-primary">
                        Crear cliente
                    </button>
                    <button type="button" id="cancel-edit" class="btn-secondary hidden">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <table class="table-shell">
                <thead class="table-head-row">
                    <tr>
                        <th class="table-head-cell">Nombre</th>
                        <th class="table-head-cell">NIF</th>
                        <th class="table-head-cell">Email</th>
                        <th class="table-head-cell">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientes-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireQueryParams } from '/common/js/session.js';
        import { bootstrapPage, renderBreadcrumbs } from '/common/js/nav.js';
        import { escapeHtml, showError, confirmAndRun, renderEmptyRow, renderSkeletonRows } from '/common/js/ui.js';
        import { iconEdit, iconTrash } from '/common/js/icons.js';

        bootstrapPage('CONTABLE', init);

        async function init() {
            const query = requireQueryParams(['empresaId'], '/contable/dashboard.html');
            if (!query) {
                return;
            }
            const { empresaId } = query;

            const form = document.getElementById('cliente-form');
            const formTitle = document.getElementById('form-title');
            const formError = document.getElementById('form-error');
            const submitButton = document.getElementById('submit-button');
            const cancelButton = document.getElementById('cancel-edit');
            const tbody = document.getElementById('clientes-body');

            let editingId = null;

            function resetForm() {
                editingId = null;
                form.reset();
                formTitle.textContent = 'Nuevo cliente';
                submitButton.textContent = 'Crear cliente';
                cancelButton.classList.add('hidden');
                showError(formError, null);
            }

            function startEdit(cliente) {
                editingId = cliente.id;
                form.nombre.value = cliente.nombre;
                form.nif.value = cliente.nif;
                form.direccion.value = cliente.direccion ?? '';
                form.email.value = cliente.email ?? '';
                formTitle.textContent = `Editando: ${cliente.nombre}`;
                submitButton.textContent = 'Guardar cambios';
                cancelButton.classList.remove('hidden');
                showError(formError, null);
                form.scrollIntoView({ behavior: 'smooth' });
            }

            async function loadBreadcrumbs() {
                const empresas = await apiFetch('/mis-empresas').catch(() => []);
                const empresa = empresas.find(e => e.id === empresaId);
                renderBreadcrumbs([
                    { label: 'Mis empresas', href: '/contable/dashboard.html' },
                    { label: empresa ? empresa.razonSocial : 'Empresa' },
                    { label: 'Clientes' },
                ]);
            }

            async function loadClientes() {
                tbody.innerHTML = renderSkeletonRows(3, 4);
                const clientes = await apiFetch(`/empresas/${empresaId}/clientes`);
                tbody.innerHTML = clientes.map(cliente => `
                    <tr class="table-row" data-id="${cliente.id}">
                        <td class="table-cell">${escapeHtml(cliente.nombre)}</td>
                        <td class="table-cell">${escapeHtml(cliente.nif)}</td>
                        <td class="table-cell">${escapeHtml(cliente.email ?? '')}</td>
                        <td class="table-cell">
                            <div class="flex gap-2">
                                <button type="button" data-action="editar" class="btn-icon">${iconEdit()} Editar</button>
                                <button type="button" data-action="eliminar" class="btn-icon-danger">${iconTrash()} Eliminar</button>
                            </div>
                        </td>
                    </tr>
                `).join('') || renderEmptyRow(4, 'Sin clientes todavia');

                tbody.querySelectorAll('button[data-action="editar"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        startEdit(clientes.find(c => c.id === id));
                    });
                });

                tbody.querySelectorAll('button[data-action="eliminar"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        confirmAndRun({
                            button,
                            confirmMessage: 'Eliminar este cliente? Esta accion no se puede deshacer.',
                            action: () => apiFetch(`/empresas/${empresaId}/clientes/${id}`, { method: 'DELETE' }),
                            onSuccess: loadClientes,
                            successMessage: 'Cliente eliminado',
                            errorFallback: 'No se pudo eliminar el cliente',
                        });
                    });
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                showError(formError, null);
                submitButton.disabled = true;

                const payload = {
                    nombre: form.nombre.value.trim(),
                    nif: form.nif.value.trim(),
                    direccion: form.direccion.value.trim() || null,
                    email: form.email.value.trim() || null,
                };

                try {
                    if (editingId) {
                        await apiFetch(`/empresas/${empresaId}/clientes/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
                    } else {
                        await apiFetch(`/empresas/${empresaId}/clientes`, { method: 'POST', body: JSON.stringify(payload) });
                    }
                    resetForm();
                    await loadClientes();
                } catch (error) {
                    showError(formError, error instanceof ApiError ? error.message : 'No se pudo guardar el cliente');
                } finally {
                    submitButton.disabled = false;
                }
            });

            cancelButton.addEventListener('click', resetForm);

            loadBreadcrumbs();
            loadClientes();
        }
    </script>
</body>
</html>
