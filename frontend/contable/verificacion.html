<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Verificacion de integridad</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-stone-900">
    <header id="app-nav" class="bg-white dark:bg-stone-800"></header>

    <main class="mx-auto max-w-3xl px-4 py-8">
        <nav id="breadcrumbs" class="mb-4 flex items-center gap-1.5 text-sm" aria-label="Breadcrumb"></nav>
        <h1 class="page-title mb-6">Verificacion de integridad</h1>

        <section id="result" class="card p-6">
            <div class="flex items-center gap-3 text-sm text-stone-500 dark:text-stone-400">
                <div class="skeleton-block h-10 w-10 rounded-full"></div>
                <p>Comprobando la cadena de hashes...</p>
            </div>
        </section>

        <section id="chain-section" class="card mt-6 hidden p-6">
            <h2 class="mb-4 text-sm font-semibold text-stone-700 dark:text-stone-300">Cadena de facturas</h2>
            <div id="chain" class="flex flex-wrap items-center gap-1"></div>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireQueryParams } from '/common/js/session.js';
        import { bootstrapPage, renderBreadcrumbs } from '/common/js/nav.js';
        import { escapeHtml } from '/common/js/ui.js';
        import { iconCheckCircle, iconXCircle, iconChevronRight } from '/common/js/icons.js';

        bootstrapPage('CONTABLE', init);

        async function init() {
            const query = requireQueryParams(['empresaId', 'serieId'], '/contable/dashboard.html');
            if (!query) {
                return;
            }
            const { empresaId, serieId } = query;

            async function loadBreadcrumbs() {
                const [empresas, series] = await Promise.all([
                    apiFetch('/mis-empresas').catch(() => []),
                    apiFetch(`/empresas/${empresaId}/series`).catch(() => []),
                ]);
                const empresa = empresas.find(e => e.id === empresaId);
                const serie = series.find(s => s.id === serieId);
                renderBreadcrumbs([
                    { label: 'Mis empresas', href: '/contable/dashboard.html' },
                    { label: empresa ? empresa.razonSocial : 'Empresa', href: `/contable/series.html?empresaId=${empresaId}` },
                    { label: serie ? serie.codigo : 'Serie', href: `/contable/series.html?empresaId=${empresaId}` },
                    { label: 'Verificacion' },
                ]);
            }

            const result = document.getElementById('result');
            const chainSection = document.getElementById('chain-section');
            const chain = document.getElementById('chain');

            /**
             * Fila visual de bloques (uno por factura, en orden) enlazados por
             * flechas, en verde hasta el punto de rotura (o todos si la cadena
             * esta integra) y en rojo desde ahi en adelante. Reutiliza el mismo
             * endpoint de listado que factura.html, sin llamada nueva al
             * backend -- solo para dar una representacion visual de la cadena,
             * la verificacion real ya la hizo el servidor.
             */
            function renderChain(facturas, verificacion) {
                if (facturas.length === 0) {
                    chainSection.classList.add('hidden');
                    return;
                }
                const rotaDesde = verificacion.integra ? null : verificacion.numero;
                const ordenadas = [...facturas].sort((a, b) => a.numero - b.numero);
                chain.innerHTML = ordenadas.map((factura, index) => {
                    const rota = rotaDesde !== null && factura.numero >= rotaDesde;
                    const tone = rota
                        ? 'border-red-300 bg-red-50 text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-400'
                        : 'border-green-300 bg-green-50 text-green-700 dark:border-green-800 dark:bg-green-950/30 dark:text-green-400';
                    const separator = index > 0 ? iconChevronRight('h-4 w-4 shrink-0 text-stone-300 dark:text-stone-600') : '';
                    return `${separator}<span title="Factura ${factura.numero}" class="flex h-9 min-w-9 items-center justify-center rounded-md border px-2 text-xs font-semibold ${tone}">${factura.numero}</span>`;
                }).join('');
                chainSection.classList.remove('hidden');
            }

            loadBreadcrumbs();

            try {
                const [verificacion, facturas] = await Promise.all([
                    apiFetch(`/empresas/${empresaId}/series/${serieId}/facturas/verificacion`),
                    apiFetch(`/empresas/${empresaId}/series/${serieId}/facturas`).catch(() => []),
                ]);

                renderChain(facturas, verificacion);

                if (verificacion.integra) {
                    result.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-green-100 text-green-700 dark:bg-green-500/15 dark:text-green-400">
                                ${iconCheckCircle('h-5 w-5')}
                            </span>
                            <div>
                                <p class="font-semibold text-stone-900 dark:text-stone-100">Cadena integra</p>
                                <p class="text-sm text-stone-500 dark:text-stone-400">${verificacion.totalFacturas} factura(s) verificada(s), sin ninguna rotura detectada.</p>
                            </div>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="flex items-start gap-3">
                            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700 dark:bg-red-500/15 dark:text-red-400">
                                ${iconXCircle('h-5 w-5')}
                            </span>
                            <div>
                                <p class="font-semibold text-red-700 dark:text-red-400">Cadena rota</p>
                                <p class="text-sm text-stone-600 dark:text-stone-300">Factura numero ${verificacion.numero}: ${escapeHtml(verificacion.motivo)}</p>
                                <p class="mt-1 text-xs text-stone-400 dark:text-stone-500">${verificacion.totalFacturas} factura(s) en la serie.</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<p class="text-sm text-red-700 dark:text-red-400">${escapeHtml(error instanceof ApiError ? error.message : 'No se pudo verificar la serie')}</p>`;
            }
        }
    </script>
</body>
</html>
