<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Verificacion de integridad</title>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50">
    <header id="app-nav" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto max-w-3xl px-4 py-8">
        <a id="back-link" href="/contable/dashboard.html" class="text-sm text-indigo-600 hover:underline">&larr; Series</a>
        <h1 class="mb-6 mt-2 text-xl font-semibold text-slate-900">Verificacion de integridad</h1>

        <section id="result" class="rounded-lg border border-slate-200 bg-white p-6">
            <p class="text-sm text-slate-500">Comprobando la cadena de hashes...</p>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireRole } from '/common/js/session.js';
        import { renderNav } from '/common/js/nav.js';

        const me = await requireRole('CONTABLE');
        if (me) {
            renderNav(me);
            init();
        }

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const empresaId = params.get('empresaId');
            const serieId = params.get('serieId');
            if (!empresaId || !serieId) {
                window.location.href = '/contable/dashboard.html';
                return;
            }
            document.getElementById('back-link').href = `/contable/series.html?empresaId=${empresaId}`;

            const result = document.getElementById('result');

            try {
                const verificacion = await apiFetch(`/empresas/${empresaId}/series/${serieId}/facturas/verificacion`);

                if (verificacion.integra) {
                    result.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-green-100 text-green-700">&check;</span>
                            <div>
                                <p class="font-semibold text-slate-900">Cadena integra</p>
                                <p class="text-sm text-slate-500">${verificacion.totalFacturas} factura(s) verificada(s), sin ninguna rotura detectada.</p>
                            </div>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="flex items-start gap-3">
                            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-100 text-red-700">&times;</span>
                            <div>
                                <p class="font-semibold text-red-700">Cadena rota</p>
                                <p class="text-sm text-slate-600">Factura numero ${verificacion.numero}: ${verificacion.motivo}</p>
                                <p class="mt-1 text-xs text-slate-400">${verificacion.totalFacturas} factura(s) en la serie.</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `<p class="text-sm text-red-700">${error instanceof ApiError ? error.message : 'No se pudo verificar la serie'}</p>`;
            }
        }
    </script>
</body>
</html>
