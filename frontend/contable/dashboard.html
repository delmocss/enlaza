<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Mis empresas</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-stone-100 dark:bg-stone-900">
    <header id="app-nav" class="bg-white dark:bg-stone-800"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="page-title mb-2">Mis empresas</h1>
        <p id="empresas-count" class="mb-6 text-sm text-stone-500 dark:text-stone-400"></p>
        <div id="empresas-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script type="module">
        import { apiFetch } from '/common/js/apiClient.js';
        import { bootstrapPage } from '/common/js/nav.js';
        import { escapeHtml } from '/common/js/ui.js';

        bootstrapPage('CONTABLE', init);

        async function init() {
            const grid = document.getElementById('empresas-grid');
            grid.innerHTML = Array.from({ length: 3 }, () => `
                <div class="card p-5">
                    <div class="skeleton-block mb-2 h-5 w-3/4"></div>
                    <div class="skeleton-block mb-4 h-4 w-1/2"></div>
                    <div class="skeleton-block h-4 w-2/3"></div>
                </div>
            `).join('');

            const empresas = await apiFetch('/mis-empresas');

            document.getElementById('empresas-count').textContent =
                `${empresas.length} empresa${empresas.length === 1 ? '' : 's'} asignada${empresas.length === 1 ? '' : 's'}`;

            grid.innerHTML = empresas.map(empresa => `
                <div class="card card-interactive p-5">
                    <h2 class="mb-1 font-semibold text-stone-900 dark:text-stone-100">${escapeHtml(empresa.razonSocial)}</h2>
                    <p class="mb-4 text-sm text-stone-500 dark:text-stone-400">${escapeHtml(empresa.nif)}</p>
                    <div class="flex gap-4 text-sm">
                        <a href="/contable/clientes.html?empresaId=${empresa.id}" class="text-canela-700 hover:underline dark:text-canela-400">Clientes</a>
                        <a href="/contable/series.html?empresaId=${empresa.id}" class="text-canela-700 hover:underline dark:text-canela-400">Series y facturas</a>
                    </div>
                </div>
            `).join('') || '<p class="empty-state col-span-full">No tienes empresas asignadas todavia.</p>';
        }
    </script>
</body>
</html>
