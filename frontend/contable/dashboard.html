<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Mis empresas</title>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50">
    <header id="app-nav" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="mb-6 text-xl font-semibold text-slate-900">Mis empresas</h1>
        <div id="empresas-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script type="module">
        import { apiFetch } from '/common/js/apiClient.js';
        import { requireRole } from '/common/js/session.js';
        import { renderNav } from '/common/js/nav.js';
        import { escapeHtml } from '/common/js/ui.js';

        const me = await requireRole('CONTABLE');
        if (me) {
            renderNav(me);
            init();
        }

        async function init() {
            const grid = document.getElementById('empresas-grid');
            const empresas = await apiFetch('/mis-empresas');

            grid.innerHTML = empresas.map(empresa => `
                <div class="rounded-lg border border-slate-200 bg-white p-5">
                    <h2 class="mb-1 font-semibold text-slate-900">${escapeHtml(empresa.razonSocial)}</h2>
                    <p class="mb-4 text-sm text-slate-500">${escapeHtml(empresa.nif)}</p>
                    <div class="flex gap-4 text-sm">
                        <a href="/contable/clientes.html?empresaId=${empresa.id}" class="text-indigo-600 hover:underline">Clientes</a>
                        <a href="/contable/series.html?empresaId=${empresa.id}" class="text-indigo-600 hover:underline">Series y facturas</a>
                    </div>
                </div>
            `).join('') || '<p class="text-sm text-slate-400">No tienes empresas asignadas todavia.</p>';
        }
    </script>
</body>
</html>
