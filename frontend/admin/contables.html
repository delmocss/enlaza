<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Contables asignados</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950">
    <header id="app-nav" class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <nav id="breadcrumbs" class="mb-4 flex items-center gap-1.5 text-sm" aria-label="Breadcrumb"></nav>
        <h1 class="mb-2 text-xl font-semibold text-slate-900 dark:text-slate-100">Contables asignados</h1>
        <p class="mb-6 text-sm text-slate-500 dark:text-slate-400">
            Solo lectura y baja: la asignacion de un CONTABLE nuevo se hace desde los usuarios semilla del sistema, no desde esta pantalla.
        </p>

        <section class="card">
            <table class="table-shell">
                <thead class="table-head-row">
                    <tr>
                        <th class="table-head-cell">Nombre</th>
                        <th class="table-head-cell">Email</th>
                        <th class="table-head-cell">Asignado el</th>
                        <th class="table-head-cell">Acciones</th>
                    </tr>
                </thead>
                <tbody id="contables-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch } from '/common/js/apiClient.js';
        import { requireQueryParams } from '/common/js/session.js';
        import { bootstrapPage, renderBreadcrumbs } from '/common/js/nav.js';
        import { escapeHtml, formatDate, confirmAndRun, renderEmptyRow, renderSkeletonRows } from '/common/js/ui.js';
        import { iconUserMinus } from '/common/js/icons.js';

        bootstrapPage('ADMIN', init);

        async function init() {
            const query = requireQueryParams(['empresaId'], '/admin/empresas.html');
            if (!query) {
                return;
            }
            const { empresaId } = query;
            const tbody = document.getElementById('contables-body');

            async function loadBreadcrumbs() {
                const empresa = await apiFetch(`/empresas/${empresaId}`).catch(() => null);
                renderBreadcrumbs([
                    { label: 'Empresas', href: '/admin/empresas.html' },
                    { label: empresa ? empresa.razonSocial : 'Empresa' },
                    { label: 'Contables' },
                ]);
            }

            async function loadContables() {
                tbody.innerHTML = renderSkeletonRows(3, 4);
                const contables = await apiFetch(`/empresas/${empresaId}/contables`);
                tbody.innerHTML = contables.map(contable => `
                    <tr class="table-row" data-id="${contable.usuarioId}">
                        <td class="table-cell">${escapeHtml(contable.nombre)}</td>
                        <td class="table-cell">${escapeHtml(contable.email)}</td>
                        <td class="table-cell">${formatDate(contable.fechaAsignacion)}</td>
                        <td class="table-cell">
                            <button type="button" data-action="quitar" class="btn-icon-danger">
                                ${iconUserMinus()} Quitar
                            </button>
                        </td>
                    </tr>
                `).join('') || renderEmptyRow(4, 'Sin contables asignados');

                tbody.querySelectorAll('button[data-action="quitar"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const usuarioId = button.closest('tr').dataset.id;
                        confirmAndRun({
                            button,
                            confirmMessage: 'Quitar a este contable de la empresa?',
                            action: () => apiFetch(`/empresas/${empresaId}/contables/${usuarioId}`, { method: 'DELETE' }),
                            onSuccess: loadContables,
                            successMessage: 'Contable eliminado de la empresa',
                            errorFallback: 'No se pudo quitar al contable',
                        });
                    });
                });
            }

            loadBreadcrumbs();
            loadContables();
        }
    </script>
</body>
</html>
