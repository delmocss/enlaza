<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Empresas</title>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50">
    <header id="app-nav" class="border-b border-slate-200 bg-white"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="mb-6 text-xl font-semibold text-slate-900">Empresas</h1>

        <section class="mb-8 rounded-lg border border-slate-200 bg-white p-6">
            <h2 id="form-title" class="mb-4 text-sm font-semibold text-slate-700">Nueva empresa</h2>
            <form id="empresa-form" class="grid grid-cols-1 gap-4 sm:grid-cols-2" novalidate>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-medium text-slate-700">Razon social</label>
                    <input name="razonSocial" required
                           class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">NIF</label>
                    <input name="nif" required
                           class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Telefono</label>
                    <input name="telefono" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Direccion</label>
                    <input name="direccion" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Email</label>
                    <input name="email" type="email" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <p id="form-error" class="hidden sm:col-span-2 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700"></p>
                <div class="flex gap-3 sm:col-span-2">
                    <button type="submit" id="submit-button"
                            class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">
                        Crear empresa
                    </button>
                    <button type="button" id="cancel-edit"
                            class="hidden rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white">
            <table class="w-full text-left text-sm">
                <thead class="border-b border-slate-200 text-slate-500">
                    <tr>
                        <th class="px-4 py-3 font-medium">Razon social</th>
                        <th class="px-4 py-3 font-medium">NIF</th>
                        <th class="px-4 py-3 font-medium">Estado</th>
                        <th class="px-4 py-3 font-medium">Acciones</th>
                    </tr>
                </thead>
                <tbody id="empresas-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { requireRole } from '/common/js/session.js';
        import { renderNav } from '/common/js/nav.js';
        import { escapeHtml, showError } from '/common/js/ui.js';

        const me = await requireRole('ADMIN');
        if (me) {
            renderNav(me);
            init();
        }

        function init() {
            const form = document.getElementById('empresa-form');
            const formTitle = document.getElementById('form-title');
            const formError = document.getElementById('form-error');
            const submitButton = document.getElementById('submit-button');
            const cancelButton = document.getElementById('cancel-edit');
            const tbody = document.getElementById('empresas-body');

            let editingId = null;

            function resetForm() {
                editingId = null;
                form.reset();
                formTitle.textContent = 'Nueva empresa';
                submitButton.textContent = 'Crear empresa';
                cancelButton.classList.add('hidden');
                showError(formError, null);
            }

            function startEdit(empresa) {
                editingId = empresa.id;
                form.razonSocial.value = empresa.razonSocial;
                form.nif.value = empresa.nif;
                form.telefono.value = empresa.telefono ?? '';
                form.direccion.value = empresa.direccion ?? '';
                form.email.value = empresa.email ?? '';
                formTitle.textContent = `Editando: ${empresa.razonSocial}`;
                submitButton.textContent = 'Guardar cambios';
                cancelButton.classList.remove('hidden');
                showError(formError, null);
                form.scrollIntoView({ behavior: 'smooth' });
            }

            function renderRow(empresa) {
                const estadoBadge = empresa.activa
                    ? '<span class="rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">Activa</span>'
                    : '<span class="rounded-full bg-slate-200 px-2 py-0.5 text-xs font-medium text-slate-600">Inactiva</span>';

                return `
                    <tr class="border-b border-slate-100 last:border-0" data-id="${empresa.id}">
                        <td class="px-4 py-3">${escapeHtml(empresa.razonSocial)}</td>
                        <td class="px-4 py-3">${escapeHtml(empresa.nif)}</td>
                        <td class="px-4 py-3">${estadoBadge}</td>
                        <td class="px-4 py-3">
                            <div class="flex flex-wrap gap-3">
                                <a href="/admin/contables.html?empresaId=${empresa.id}"
                                   class="text-indigo-600 hover:underline">Contables</a>
                                <button type="button" data-action="editar" class="text-slate-600 hover:underline">Editar</button>
                                <button type="button" data-action="toggle" class="text-slate-600 hover:underline">
                                    ${empresa.activa ? 'Desactivar' : 'Activar'}
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            async function loadEmpresas() {
                const empresas = await apiFetch('/empresas');
                tbody.innerHTML = empresas.map(renderRow).join('')
                    || '<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">Sin empresas todavia</td></tr>';

                tbody.querySelectorAll('button[data-action="editar"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        const empresa = empresas.find(e => e.id === id);
                        startEdit(empresa);
                    });
                });

                tbody.querySelectorAll('button[data-action="toggle"]').forEach(button => {
                    button.addEventListener('click', async () => {
                        const id = button.closest('tr').dataset.id;
                        const empresa = empresas.find(e => e.id === id);
                        const accion = empresa.activa ? 'desactivar' : 'activar';
                        button.disabled = true;
                        try {
                            await apiFetch(`/empresas/${id}/${accion}`, { method: 'PATCH' });
                            await loadEmpresas();
                        } catch (error) {
                            alert(error instanceof ApiError ? error.message : 'No se pudo actualizar la empresa');
                            button.disabled = false;
                        }
                    });
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                showError(formError, null);
                submitButton.disabled = true;

                const payload = {
                    razonSocial: form.razonSocial.value.trim(),
                    nif: form.nif.value.trim(),
                    direccion: form.direccion.value.trim() || null,
                    email: form.email.value.trim() || null,
                    telefono: form.telefono.value.trim() || null,
                };

                try {
                    if (editingId) {
                        await apiFetch(`/empresas/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
                    } else {
                        await apiFetch('/empresas', { method: 'POST', body: JSON.stringify(payload) });
                    }
                    resetForm();
                    await loadEmpresas();
                } catch (error) {
                    showError(formError, error instanceof ApiError ? error.message : 'No se pudo guardar la empresa');
                } finally {
                    submitButton.disabled = false;
                }
            });

            cancelButton.addEventListener('click', resetForm);

            loadEmpresas();
        }
    </script>
</body>
</html>
