<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enlaza - Empresas</title>
    <script src="/common/js/theme-init.js"></script>
    <link rel="stylesheet" href="/common/css/styles.css" />
    <script src="/common/js/config.js"></script>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950">
    <header id="app-nav" class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"></header>

    <main class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="mb-6 text-xl font-semibold text-slate-900 dark:text-slate-100">Empresas</h1>

        <section class="card mb-8 p-6">
            <h2 id="form-title" class="mb-4 text-sm font-semibold text-slate-700 dark:text-slate-300">Nueva empresa</h2>
            <form id="empresa-form" class="grid grid-cols-1 gap-4 sm:grid-cols-2" novalidate>
                <div class="sm:col-span-2">
                    <label class="field-label">Razon social</label>
                    <input name="razonSocial" required class="field-input" />
                </div>
                <div>
                    <label class="field-label">NIF</label>
                    <input name="nif" required class="field-input" />
                </div>
                <div>
                    <label class="field-label">Telefono</label>
                    <input name="telefono" class="field-input" />
                </div>
                <div>
                    <label class="field-label">Direccion</label>
                    <input name="direccion" class="field-input" />
                </div>
                <div>
                    <label class="field-label">Email</label>
                    <input name="email" type="email" class="field-input" />
                </div>
                <p id="form-error" class="hidden banner-error sm:col-span-2"></p>
                <div class="flex gap-3 sm:col-span-2">
                    <button type="submit" id="submit-button" class="btn-primary">
                        Crear empresa
                    </button>
                    <button type="button" id="cancel-edit" class="btn-secondary hidden">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <table class="table-shell">
                <thead class="table-head-row">
                    <tr>
                        <th class="table-head-cell">Razon social</th>
                        <th class="table-head-cell">NIF</th>
                        <th class="table-head-cell">Estado</th>
                        <th class="table-head-cell">Acciones</th>
                    </tr>
                </thead>
                <tbody id="empresas-body"></tbody>
            </table>
        </section>
    </main>

    <script type="module">
        import { apiFetch, ApiError } from '/common/js/apiClient.js';
        import { bootstrapPage } from '/common/js/nav.js';
        import { escapeHtml, showError, renderBadge, confirmAndRun, renderEmptyRow, renderSkeletonRows } from '/common/js/ui.js';
        import { iconEdit, iconPower, iconUsers } from '/common/js/icons.js';

        bootstrapPage('ADMIN', init);

        function init() {
            const form = document.getElementById('empresa-form');
            const formTitle = document.getElementById('form-title');
            const formError = document.getElementById('form-error');
            const submitButton = document.getElementById('submit-button');
            const cancelButton = document.getElementById('cancel-edit');
            const tbody = document.getElementById('empresas-body');

            let editingId = null;

            function resetForm() {
                editingId = null;
                form.reset();
                formTitle.textContent = 'Nueva empresa';
                submitButton.textContent = 'Crear empresa';
                cancelButton.classList.add('hidden');
                showError(formError, null);
            }

            function startEdit(empresa) {
                editingId = empresa.id;
                form.razonSocial.value = empresa.razonSocial;
                form.nif.value = empresa.nif;
                form.telefono.value = empresa.telefono ?? '';
                form.direccion.value = empresa.direccion ?? '';
                form.email.value = empresa.email ?? '';
                formTitle.textContent = `Editando: ${empresa.razonSocial}`;
                submitButton.textContent = 'Guardar cambios';
                cancelButton.classList.remove('hidden');
                showError(formError, null);
                form.scrollIntoView({ behavior: 'smooth' });
            }

            function renderRow(empresa) {
                return `
                    <tr class="table-row" data-id="${empresa.id}">
                        <td class="table-cell">${escapeHtml(empresa.razonSocial)}</td>
                        <td class="table-cell">${escapeHtml(empresa.nif)}</td>
                        <td class="table-cell">${renderBadge(empresa.activa, 'Activa', 'Inactiva')}</td>
                        <td class="table-cell">
                            <div class="flex flex-wrap gap-2">
                                <a href="/admin/contables.html?empresaId=${empresa.id}" class="btn-icon">
                                    ${iconUsers()} Contables
                                </a>
                                <button type="button" data-action="editar" class="btn-icon">
                                    ${iconEdit()} Editar
                                </button>
                                <button type="button" data-action="toggle" class="btn-icon">
                                    ${iconPower()} ${empresa.activa ? 'Desactivar' : 'Activar'}
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }

            async function loadEmpresas() {
                tbody.innerHTML = renderSkeletonRows(3, 4);
                const empresas = await apiFetch('/empresas');
                tbody.innerHTML = empresas.map(renderRow).join('') || renderEmptyRow(4, 'Sin empresas todavia');

                tbody.querySelectorAll('button[data-action="editar"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        const empresa = empresas.find(e => e.id === id);
                        startEdit(empresa);
                    });
                });

                tbody.querySelectorAll('button[data-action="toggle"]').forEach(button => {
                    button.addEventListener('click', () => {
                        const id = button.closest('tr').dataset.id;
                        const empresa = empresas.find(e => e.id === id);
                        const accion = empresa.activa ? 'desactivar' : 'activar';
                        confirmAndRun({
                            button,
                            action: () => apiFetch(`/empresas/${id}/${accion}`, { method: 'PATCH' }),
                            onSuccess: loadEmpresas,
                            successMessage: empresa.activa ? 'Empresa desactivada' : 'Empresa activada',
                            errorFallback: 'No se pudo actualizar la empresa',
                        });
                    });
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                showError(formError, null);
                submitButton.disabled = true;

                const payload = {
                    razonSocial: form.razonSocial.value.trim(),
                    nif: form.nif.value.trim(),
                    direccion: form.direccion.value.trim() || null,
                    email: form.email.value.trim() || null,
                    telefono: form.telefono.value.trim() || null,
                };

                try {
                    if (editingId) {
                        await apiFetch(`/empresas/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
                    } else {
                        await apiFetch('/empresas', { method: 'POST', body: JSON.stringify(payload) });
                    }
                    resetForm();
                    await loadEmpresas();
                } catch (error) {
                    showError(formError, error instanceof ApiError ? error.message : 'No se pudo guardar la empresa');
                } finally {
                    submitButton.disabled = false;
                }
            });

            cancelButton.addEventListener('click', resetForm);

            loadEmpresas();
        }
    </script>
</body>
</html>
