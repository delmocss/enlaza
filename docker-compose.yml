services:
  postgres:
    image: postgres:16-alpine
    container_name: enlaza-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enlaza}
      POSTGRES_USER: ${POSTGRES_USER:-enlaza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - enlaza-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enlaza} -d ${POSTGRES_DB:-enlaza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: enlaza-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enlaza}
      DB_USERNAME: ${POSTGRES_USER:-enlaza}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@enlaza.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      DEMO_CONTABLE_EMAIL: ${DEMO_CONTABLE_EMAIL:-contable@enlaza.dev}
      DEMO_CONTABLE_PASSWORD: ${DEMO_CONTABLE_PASSWORD:-Contable123!}
      DEMO_CLIENTE_EMAIL: ${DEMO_CLIENTE_EMAIL:-cliente@enlaza.dev}
      DEMO_CLIENTE_PASSWORD: ${DEMO_CLIENTE_PASSWORD:-Cliente123!}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:8081}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

  frontend:
    build: ./frontend
    container_name: enlaza-frontend
    depends_on:
      - app
    ports:
      - "8081:80"

volumes:
  enlaza-postgres-data:
