spring:
  application:
    name: enlaza

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enlaza}
    username: ${DB_USERNAME:enlaza}
    password: ${DB_PASSWORD:enlaza}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@enlaza.dev}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    contable-email: ${DEMO_CONTABLE_EMAIL:contable@enlaza.dev}
    contable-password: ${DEMO_CONTABLE_PASSWORD:Contable123!}
    cliente-email: ${DEMO_CLIENTE_EMAIL:cliente@enlaza.dev}
    cliente-password: ${DEMO_CLIENTE_PASSWORD:Cliente123!}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Solo "health": es publico (lo consulta el healthcheck de la
        # plataforma de despliegue sin autenticar), y show-details en su
        # valor por defecto ("never") evita filtrar detalles internos
        # (conexion a BD, espacio en disco) a una ruta sin autenticacion.
        include: health

logging:
  level:
    root: INFO
    com.enlaza: INFO
